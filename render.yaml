services:
  # ==========================================
  # MeetFlow Backend API & Socket.IO Service
  # ==========================================
  - type: web
    name: meetflow-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: MONGO_URL
        sync: false

  # ==========================================
  # MeetFlow Frontend Static Site (Vite + React)
  # ==========================================
  - type: web
    name: meetflow-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # SPA rewrite rule to ensure React Router routes (e.g. /:url, /home, /history) load correctly on refresh
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        sync: false
